<!-- templates/notifications.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Уведомления</title>
    <script>
        // Каждые 10 секунд обновлять страницу
        setTimeout(function(){
            window.location.reload(1);
        }, 3000);
    </script>
</head>
<body>
    <h1>Уведомления</h1>
    <ul>
        {% for notification in notifications %}
            <li>
                {{ notification.title }} ({{ notification.created_at }})
                <p>{{ notification.message }}</p>
                {% if notification.image %}
                    <img src="/media/{{ notification.image.name }}" alt="Изображение" width="200">

                {% endif %}
            </li>
        {% endfor %}
    </ul>
</body>
</html>
